name: Bug report
description: Something in the app behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The **Diagnostic** tab answers most of the questions below
        in one screenshot — grabbing it first is usually faster than typing.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the sidebar and in the About tab.
      placeholder: "0.6.0"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic tab
      description: |
        A screenshot of the **Diagnostic** tab, or its contents pasted as text. It shows
        the resolved paths, which save is loaded, whether the mod is installed, and
        whether the completion marks decoded reliably.
      placeholder: Drag a screenshot here.

  - type: dropdown
    id: crash
    attributes:
      label: Did the GAME itself crash?
      description: |
        Not the app - Isaac. The companion mod runs inside the game, so a mod bug can
        take the game down and cost you a floor. If that is what happened, the next
        field is the single most useful thing you can send.
      options:
        - "No, the game was fine"
        - "Yes, Isaac crashed to desktop"
        - "Yes, and it happens every time at the same spot"
    validations:
      required: true

  - type: textarea
    id: gamelog
    attributes:
      label: Isaac's log file (only if the game crashed)
      description: |
        Attach `log.txt`, or paste its **last 40 lines**. Its path is shown in the app's
        **Diagnostic** tab; by default it is
        `Documents\My Games\Binding of Isaac Repentance+\log.txt`.

        It records the room you were entering and the Lua stack trace that ended the
        process. That is usually the entire answer: a crash in the Mineshaft Lobby was
        traced to one line of the mod from those few lines alone.
      placeholder: |
        [INFO] - Room 1.10017(Mineshaft Lobby)
        [INFO] - Lua stack trace:
        ...
        [INFO] - Caught exception, writing minidump...
      render: text

  - type: input
    id: savefile
    attributes:
      label: Save file name
      description: |
        Only if the bug involves reading a save. The prefix identifies the edition and is
        often the whole answer — `rep+persistentgamedata1.dat` (Repentance+),
        `rep_persistentgamedata1.dat` (Repentance), `persistentgamedata1.dat` (Rebirth).
      placeholder: "rep+persistentgamedata1.dat"

  - type: dropdown
    id: mod
    attributes:
      label: Is the companion stats mod installed?
      options:
        - "Yes, and Isaac has been restarted since"
        - "Yes, but Isaac has not been restarted"
        - "No"
        - "Not sure"

  - type: input
    id: lang
    attributes:
      label: Interface language
      description: Relevant for anything about wording or layout.
      placeholder: "English"

  - type: checkboxes
    id: sanity
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest release (About → Check for updates)
        - label: I understand the app never modifies my save, so this is not about lost progress
