# Builds the Windows installer and attaches it to a GitHub Release.
# The build runs in CI (dev time) — that does not break the "offline app"
# constraint, which only concerns the application's runtime.
#
# Created by reiassezbeau — https://github.com/reiassezbeau
#
# Trigger: MANUAL only (workflow_dispatch).
# The automatic tag trigger was removed on purpose: releases are published with
# an installer built and verified locally, and a CI run firing on the same tag
# would create a duplicate release and duplicate assets.
# To publish from CI: Actions tab → "Release (Windows installer)"
# → Run workflow → enter the tag.

name: Release (Windows installer)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Build + Release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Isaac Completion Tracker ${{ inputs.tag }}"
          releaseBody: |
            Windows installer (**.exe** NSIS + **.msi**) for Isaac Completion Tracker.

            > ⚠️ Unsigned: Windows SmartScreen will show "unknown publisher".
            > Click **"More info" → "Run anyway"**.

            Created by [reiassezbeau](https://github.com/reiassezbeau).
          releaseDraft: true
          prerelease: false
